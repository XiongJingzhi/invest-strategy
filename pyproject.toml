[project]
name = "invest-strategy"
version = "0.1.0"
description = "Local Streamlit app for investment strategy backtesting and advice."
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.14",
    "exchange-calendars>=4.11,<5",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.22",
    "python-dateutil>=2.8",
    "streamlit>=1.36",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
