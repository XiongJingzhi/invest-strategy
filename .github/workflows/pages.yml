name: Build and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '35 22 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e .
      # Regression tests must use the committed, audited snapshots.
      - run: python scripts/build_web_data.py
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - name: Refresh verified market snapshots on schedule
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/refresh_web_data.py
      - name: Rebuild site data from refreshed snapshots
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/build_web_data.py
      - run: npm run build --prefix web
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
